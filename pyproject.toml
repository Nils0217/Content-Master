[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentmaster"
version = "0.1.0"
description = "Compound marketing agent: extract -> draft -> review -> publish -> track -> improve, with real memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "atproto",
    "striprtf",
    "duckdb",       # analysis.py reads warehouse/local.duckdb directly (read-only, no dbt needed at read time)
]
# "rocketride" removed 2026-09-13 — draft_generator.py (renamed from
# rocketride_client.py) never actually used the RocketRide SDK, only
# `requests` to call Ollama directly. See docs/LOG.md.

[project.optional-dependencies]
# Full dbt-duckdb stack — only needed if you're running `dbt` yourself to
# (re)build the warehouse. analysis.py only needs the lightweight `duckdb`
# package above (a core dep) to *read* what dbt already built. See
# warehouse/README.md.
warehouse = ["dbt-duckdb"]

[project.scripts]
contentmaster = "contentmaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["contentmaster*"]
# src/automarketer/ was the pre-rename package (see docs/LOG.md
# 2026-09-13) — already deleted from disk. This include= filter stays as
# a guard against anything similarly-named reappearing under src/.
