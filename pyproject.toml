[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentmaster"
version = "0.1.0"
description = "Compound marketing agent: extract -> draft -> review -> publish -> track -> improve, with real memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "atproto",
    "striprtf",
    "rocketride",   # only used by rocketride_client.py — see docs/SCHEDULE.md Phase 0
]

[project.optional-dependencies]
# Analytics layer (warehouse/) — separate from the core package, only
# needed if you're running `dbt` yourself. See warehouse/README.md.
warehouse = ["dbt-duckdb"]

[project.scripts]
contentmaster = "contentmaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["contentmaster*"]
# src/automarketer/ is the pre-rename package — dead code, nothing imports
# it (see docs/LOG.md 2026-09-13). Left in place only because this dev
# environment's `rm` was blocked when the rename happened; delete it by
# hand: `rm -rf src/automarketer`. Excluded here so it's never packaged.
